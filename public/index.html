<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanFlow — Simple & Elegant To-Do App</title>
  <meta name="description" content="A simple, fast, and beautifully designed to-do application built with Node.js. Manage your daily tasks effortlessly.">
  <meta name="theme-color" content="#6366f1">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">
  <div class="app-background"></div>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Tasks</h1>
          <p class="current-date" id="current-date">Today</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="install-app-btn" class="install-btn" aria-label="Install app" title="Install as Desktop App" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Install</span>
        </button>

        <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle dark/light mode" title="Toggle theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Progress Card -->
    <section class="progress-section" id="progress-card">
      <div class="progress-info">
        <span class="progress-text" id="progress-text">0 of 0 completed</span>
        <span class="progress-percentage" id="progress-percentage">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%;"></div>
      </div>
    </section>

    <!-- Add Task Input Form -->
    <section class="input-section">
      <form id="todo-form" class="todo-form">
        <div class="input-wrapper">
          <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          <input 
            type="text" 
            id="task-input" 
            name="title"
            placeholder="Add a new task... (Press Enter)" 
            autocomplete="off" 
            maxlength="150"
            required
          />
        </div>
        <button type="submit" id="add-task-btn" class="primary-btn">
          <span>Add</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </form>
    </section>

    <!-- Filters & Action Bar -->
    <section class="controls-section">
      <div class="filter-tabs" role="tablist">
        <button id="filter-all-btn" class="tab-btn active" data-filter="all" role="tab" aria-selected="true">
          All <span class="counter" id="count-all">0</span>
        </button>
        <button id="filter-active-btn" class="tab-btn" data-filter="active" role="tab" aria-selected="false">
          Active <span class="counter" id="count-active">0</span>
        </button>
        <button id="filter-completed-btn" class="tab-btn" data-filter="completed" role="tab" aria-selected="false">
          Completed <span class="counter" id="count-completed">0</span>
        </button>
      </div>

      <button id="clear-completed-btn" class="text-btn danger-hover" style="display: none;" title="Delete all completed tasks">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Clear Done</span>
      </button>
    </section>

    <!-- Task List -->
    <section class="tasks-section">
      <ul id="todo-list" class="todo-list" aria-live="polite">
        <!-- Tasks rendered dynamically by JavaScript -->
      </ul>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-illustration">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <h3 id="empty-state-title" class="empty-title">All caught up!</h3>
        <p id="empty-state-subtitle" class="empty-subtitle">You have no tasks here right now. Enjoy your day or add one above.</p>
      </div>
    </section>

    <!-- Footer Stats / Shortcuts -->
    <footer class="app-footer">
      <span id="footer-summary">Loading tasks...</span>
      <span class="powered-by">Powered by Node.js</span>
    </footer>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
